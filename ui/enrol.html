<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Connect worker</title>
    <link rel="stylesheet" href="enrol.css" />
    <script type="module" src="enrol.js"></script>
  </head>
  <body>
    <main>
      <form id="form" autocomplete="off" novalidate>
        <h1>Connect worker</h1>
        <p class="hint">
          Open the board, set up encryption, create a machine token on its Settings page, then paste the token and the
          data key here.
        </p>
        <label for="token">Machine token</label>
        <input
          id="token"
          type="password"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        />
        <p class="count" id="token-count"></p>
        <label for="data-key">Data key</label>
        <input
          id="data-key"
          type="password"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
        />
        <p class="count" id="data-key-count"></p>
        <p id="error" class="callout" role="alert" hidden></p>
        <p id="status" role="status"></p>
        <div class="buttons">
          <button type="button" id="cancel">Cancel</button>
          <button type="submit" id="connect" class="primary">Connect</button>
        </div>
      </form>
      <section id="done" hidden>
        <h1>Connected</h1>
        <p id="done-text" role="status"></p>
        <div class="buttons">
          <button type="button" id="close" class="primary">Close</button>
        </div>
      </section>
    </main>
  </body>
</html>
